<div class="modal-container" (click)="(close)">
  <div class="modal-backdrop" (click)="$event.stopPropagation()"></div>
  <div class="modal-header" mat-dialog-title>
    <h4 mat-dialog-title i18n="@@modalTitle">{{ data.title }}</h4>
    <button (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div mat-dialog-content class="modal-content" i18n="@@modalContent">
    {{ data.message }}
  </div>
</div>
