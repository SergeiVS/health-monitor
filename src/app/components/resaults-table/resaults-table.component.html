<div class="table-container">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef class="cell">Datum</th>
      <td mat-cell *matCellDef="let element" class="cell">
        {{ element.date | date : "dd.MM.yyyy" }}
      </td>
    </ng-container>
    <ng-container matColumnDef="time">
      <th mat-header-cell *matHeaderCellDef class="cell">Zeit</th>
      <td mat-cell *matCellDef="let element" class="cell">
        {{ element.time }}
      </td>
    </ng-container>
    <ng-container matColumnDef="sys">
      <th mat-header-cell *matHeaderCellDef class="cell">Sys.</th>
      <td mat-cell *matCellDef="let element" class="cell">{{ element.sys }}</td>
    </ng-container>
    <ng-container matColumnDef="dis">
      <th mat-header-cell *matHeaderCellDef class="cell">Dias.</th>
      <td mat-cell *matCellDef="let element" class="cell">{{ element.dis }}</td>
    </ng-container>
    <ng-container matColumnDef="puls">
      <th mat-header-cell *matHeaderCellDef class="cell">Puls</th>
      <td mat-cell *matCellDef="let element" class="cell">
        {{ element.puls }}
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
