<div class="page-wrapper">
  <h4 i18n="@@pleaseLogin">Please log in</h4>

  <div class="remember-me-section">
    <label class="checkbox-label">
      <input
        type="checkbox"
        [checked]="rememberMe()"
        (change)="toggleRememberMe()"
        class="checkbox-input"
      />
      <span i18n="@@rememberMe">Remember me</span>
    </label>
    <small class="checkbox-hint" i18n="@@stayLoggedOnThisDevice">Stay logged in on this device</small>
  </div>

  <p i18n="@@loginButtonIsInTheHeader">Login button is located in the header of the page</p>
</div>
