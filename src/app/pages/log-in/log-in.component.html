<div class="page-wrapper">
  <h4>Bitte loggen Sie sich ein</h4>

  <div class="remember-me-section">
    <label class="checkbox-label">
      <input
        type="checkbox"
        [checked]="rememberMe()"
        (change)="toggleRememberMe()"
        class="checkbox-input"
      />
      <span i18n="@@rememberMe">Remember me</span>
    </label>
    <small class="checkbox-hint">Bleiben Sie angemeldet auf diesem Gerät</small>
  </div>

  <p>Login Knopf befindet sich im Kopf der Seite</p>
</div>
